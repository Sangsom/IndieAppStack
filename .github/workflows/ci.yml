name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `cache: npm` is set explicitly, so setup-node v5's automatic
      # package-manager caching changes nothing for this workflow.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Design contrast
        run: npm run design:contrast

      - name: Public content safety
        run: npm run content:safety

      - name: Build
        run: npm run build

      - name: Supabase client bundle guard
        run: npm run security:check-supabase-key

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Where each free tier in a solo iOS subscription stack ends</title>
  <desc id="desc">Six limits checked Nov 3, 2026. RevenueCat Pro is free up to 2,500 dollars in monthly tracked revenue, then 1 percent of all of it. The App Store Small Business Program applies up to 1 million dollars in proceeds per calendar year. Kit is free up to 10,000 subscribers; Creator is priced by list size. Supabase Free has a 500 MB database and 50,000 monthly active users, and idle projects pause after 1 week. Xcode Cloud includes 25 compute hours a month, then 100 hours cost 49.99 dollars a month. Appfigures Starter is free for 5 connected apps; keyword tracking starts at Monitor, which is 35.99 dollars a month billed annually.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#20241f" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #fbfaf7; }
      .title { font: 700 34px "Source Serif 4", Georgia, serif; fill: #20241f; }
      .subtitle { font: 500 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #6e6a5e; }
      .label { font: 700 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #2c5f4f; letter-spacing: 0.08em; }
      .limit { font: 700 30px "Source Serif 4", Georgia, serif; fill: #20241f; }
      .muted { font: 500 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #6e6a5e; }
      .on-pine { font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #fbfaf7; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <rect x="48" y="36" width="1104" height="688" rx="12" fill="#ffffff" filter="url(#shadow)"/>
  <text x="88" y="96" class="title">Where each free tier ends</text>
  <text x="88" y="132" class="subtitle">The published limit for each $0 or reduced-rate line in the ledger, and what comes next.</text>

  <rect x="88" y="164" width="500" height="150" rx="10" fill="#e8efea" stroke="#2c5f4f" stroke-width="1.5"/>
  <text x="112" y="200" class="label">REVENUECAT PRO</text>
  <text x="112" y="244" class="limit">$2,500 a month</text>
  <text x="112" y="274" class="muted">Monthly tracked revenue. Above it, 1 percent of all</text>
  <text x="112" y="296" class="muted">of that month. A month back under the line is $0.</text>

  <rect x="612" y="164" width="500" height="150" rx="10" fill="#e8efea" stroke="#2c5f4f" stroke-width="1.5"/>
  <text x="636" y="200" class="label">APP STORE SMALL BUSINESS PROGRAM</text>
  <text x="636" y="244" class="limit">$1 million a year</text>
  <text x="636" y="274" class="muted">In proceeds per calendar year. Above it, the</text>
  <text x="636" y="296" class="muted">standard commission rate applies to future sales.</text>

  <rect x="88" y="334" width="500" height="150" rx="10" fill="#e8efea" stroke="#2c5f4f" stroke-width="1.5"/>
  <text x="112" y="370" class="label">KIT FREE</text>
  <text x="112" y="414" class="limit">10,000 subscribers</text>
  <text x="112" y="444" class="muted">Above it, Creator, priced by list size. The page</text>
  <text x="112" y="466" class="muted">prints $33 a month only for 1,000 subscribers.</text>

  <rect x="612" y="334" width="500" height="150" rx="10" fill="#e8efea" stroke="#2c5f4f" stroke-width="1.5"/>
  <text x="636" y="370" class="label">SUPABASE FREE</text>
  <text x="636" y="414" class="limit">500 MB database</text>
  <text x="636" y="444" class="muted">50,000 monthly active users. Idle projects pause</text>
  <text x="636" y="466" class="muted">after 1 week. Pro is from $25 a month.</text>

  <rect x="88" y="504" width="500" height="150" rx="10" fill="#e8efea" stroke="#2c5f4f" stroke-width="1.5"/>
  <text x="112" y="540" class="label">XCODE CLOUD</text>
  <text x="112" y="584" class="limit">25 hours a month</text>
  <text x="112" y="614" class="muted">Compute hours included with membership. Next,</text>
  <text x="112" y="636" class="muted">100 hours for $49.99 a month.</text>

  <rect x="612" y="504" width="500" height="150" rx="10" fill="#e8efea" stroke="#2c5f4f" stroke-width="1.5"/>
  <text x="636" y="540" class="label">APPFIGURES STARTER</text>
  <text x="636" y="584" class="limit">Free for 5 apps</text>
  <text x="636" y="614" class="muted">Keyword tracking starts at Monitor, $35.99 a</text>
  <text x="636" y="636" class="muted">month on annual billing, with 100 keywords.</text>

  <rect x="88" y="672" width="1024" height="32" rx="6" fill="#2c5f4f"/>
  <text x="112" y="694" class="on-pine">Limits as printed on each vendor's pricing page, checked Nov 3, 2026.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">RevenueCat alternatives decision guide</title>
  <desc id="desc">A decision guide routing a solo builder from RevenueCat to Adapty for paywall analytics, Superwall for remote iteration, Qonversion for a lower percentage, Apphud for a higher free tier on tracked revenue, or StoreKit 2 for no vendor fee.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .title { font: 600 34px "Source Serif 4", Georgia, serif; fill: #20241f; }
      .subtitle { font: 500 16px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
      .tool { font: 600 26px "Source Serif 4", Georgia, serif; fill: #20241f; }
      .role { font: 700 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #2c5f4f; letter-spacing: 1.2px; }
      .copy { font: 500 16px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20241f; }
      .base { font: 600 16px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fbfaf7; }
      .foot { font: 500 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="860"/>
  <text x="56" y="64" class="title">Pick the alternative by the job</text>
  <text x="56" y="98" class="subtitle">RevenueCat stays the default. Switch when one job is the bottleneck. Fees are on the chart, not on this diagram.</text>

  <rect x="56" y="124" width="1088" height="52" rx="7" fill="#20241f"/>
  <text x="80" y="156" class="base">Already on RevenueCat? Route by the job the default does not do.</text>

  <rect x="56" y="204" width="344" height="240" rx="7" fill="#e8efea" stroke="#2c5f4f" stroke-width="2"/>
  <text x="80" y="244" class="role">PAYWALL ANALYTICS</text>
  <text x="80" y="286" class="tool">Adapty</text>
  <text x="80" y="332" class="copy">Paywall tests and</text>
  <text x="80" y="356" class="copy">subscription analytics</text>
  <text x="80" y="380" class="copy">are the weekly job.</text>

  <rect x="428" y="204" width="344" height="240" rx="7" fill="#fbfaf7" stroke="#9a6b23" stroke-width="2"/>
  <text x="452" y="244" class="role">REMOTE ITERATION</text>
  <text x="452" y="286" class="tool">Superwall</text>
  <text x="452" y="332" class="copy">Change paywalls</text>
  <text x="452" y="356" class="copy">without an app release.</text>
  <text x="452" y="380" class="copy">Infrastructure stays free.</text>

  <rect x="800" y="204" width="344" height="240" rx="7" fill="#f4f1ea" stroke="#20241f" stroke-width="2"/>
  <text x="824" y="244" class="role">LOWER PERCENTAGE</text>
  <text x="824" y="286" class="tool">Qonversion</text>
  <text x="824" y="332" class="copy">One plan. The meter</text>
  <text x="824" y="356" class="copy">is the reason</text>
  <text x="824" y="380" class="copy">to switch.</text>

  <rect x="242" y="468" width="344" height="240" rx="7" fill="#f8ece9" stroke="#9e4434" stroke-width="2"/>
  <text x="266" y="508" class="role">HIGHER FREE TIER</text>
  <text x="266" y="550" class="tool">Apphud</text>
  <text x="266" y="596" class="copy">A longer free line</text>
  <text x="266" y="620" class="copy">on tracked revenue,</text>
  <text x="266" y="644" class="copy">then a percentage</text>
  <text x="266" y="668" class="copy">with a monthly floor.</text>

  <rect x="614" y="468" width="344" height="240" rx="7" fill="#f3f1ec" stroke="#6e6a5e" stroke-width="2"/>
  <text x="638" y="508" class="role">NO VENDOR FEE</text>
  <text x="638" y="550" class="tool">StoreKit 2</text>
  <text x="638" y="596" class="copy">Apple's purchase APIs.</text>
  <text x="638" y="620" class="copy">No third-party fee.</text>
  <text x="638" y="644" class="copy">You own the setup.</text>

  <text x="56" y="760" class="foot">Match the card to the job, then read the dated fee chart before you migrate.</text>
  <text x="56" y="788" class="foot">This diagram prints no prices. IndieAppStack.</text>
</svg>

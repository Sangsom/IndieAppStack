<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Crashlytics dSYM path used for Mantis</title>
  <desc id="desc">The symbol upload path used for Mantis: pass the plist into the Crashlytics run script, skip the dSYM upload script on Debug and Archive builds, and upload dSYMs with fastlane for TestFlight and App Store builds.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#15202b" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 760 36px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20241f; }
      .subtitle { font: 500 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
      .tag { font: 740 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6c76; letter-spacing: 1px; }
      .step { font: 760 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20241f; }
      .copy { font: 520 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374550; }
      .small { font: 520 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #66737d; }
      .num { font: 800 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
    </style>
  </defs>
  <rect width="1200" height="780" fill="#fbfaf7"/>
  <rect x="48" y="32" width="1104" height="716" rx="34" fill="#ffffff" filter="url(#shadow)"/>
  <text x="88" y="88" class="title">Getting Crashlytics symbols out of Xcode</text>
  <text x="90" y="124" class="subtitle">Setup notes from Mantis, our iPhone trading journal. Not a vendor sample.</text>

  <rect x="88" y="160" width="1024" height="150" rx="24" fill="#f8ece8" stroke="#9e4434" stroke-width="2"/>
  <text x="116" y="198" class="tag">BUILD ERRORS</text>
  <text x="116" y="236" class="copy">Sandbox: upload-symbols & deny(1) file-read-data &/GoogleService-Info.plist</text>
  <text x="116" y="270" class="copy">Could not get GOOGLE_APP_ID in Google Services file from build environment</text>

  <rect x="88" y="336" width="320" height="250" rx="24" fill="#e8efea" stroke="#2c5f4f" stroke-width="2"/>
  <circle cx="124" cy="376" r="18" fill="#2c5f4f"/>
  <text x="118" y="382" class="num">1</text>
  <text x="156" y="382" class="tag">RUN SCRIPT</text>
  <text x="116" y="430" class="step">Pass the plist</text>
  <text x="116" y="470" class="copy">Give the Crashlytics run</text>
  <text x="116" y="494" class="copy">script the plist path</text>
  <text x="116" y="518" class="copy">explicitly.</text>

  <rect x="440" y="336" width="320" height="250" rx="24" fill="#fff2dc" stroke="#e3b762" stroke-width="2"/>
  <circle cx="476" cy="376" r="18" fill="#9a6b23"/>
  <text x="470" y="382" class="num">2</text>
  <text x="508" y="382" class="tag">LOCAL BUILDS</text>
  <text x="468" y="430" class="step">Skip upload</text>
  <text x="468" y="470" class="copy">Skip the dSYM upload</text>
  <text x="468" y="494" class="copy">script on Debug and</text>
  <text x="468" y="518" class="copy">Archive builds.</text>

  <rect x="792" y="336" width="320" height="250" rx="24" fill="#e9f2ff" stroke="#91b8e8" stroke-width="2"/>
  <circle cx="828" cy="376" r="18" fill="#407db9"/>
  <text x="822" y="382" class="num">3</text>
  <text x="860" y="382" class="tag">STORE BUILDS</text>
  <text x="820" y="430" class="step">Use fastlane</text>
  <text x="820" y="470" class="copy">upload_symbols_to_crashlytics</text>
  <text x="820" y="494" class="copy">sends dSYMs for TestFlight</text>
  <text x="820" y="518" class="copy">and App Store builds.</text>

  <rect x="88" y="612" width="1024" height="88" rx="22" fill="#f8faf9" stroke="#dbe4e8"/>
  <text x="116" y="652" class="step">Then check the console</text>
  <text x="430" y="648" class="copy">A test crash has to show up in the Crashlytics console</text>
  <text x="430" y="674" class="copy">before the setup counts as finished.</text>
</svg>

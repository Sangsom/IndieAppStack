<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Which September 2026 App Store fee applies</title>
  <desc id="desc">The initial acquisition fee and the store services fee are eliminated. In-App Purchase on the EU App Store is 15 or 26 percent. An actionable link-out within 7 days pays a store services commission of 10 or 15 percent. Apps distributed outside the App Store pay a 5 percent Core Technology Commission.</desc>
  <defs>
    <filter id="cardshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#20241f" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #fbfaf7; }
      .title { font: 700 34px "Source Serif 4", Georgia, serif; fill: #20241f; }
      .subtitle { font: 500 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #6e6a5e; }
      .label { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #6e6a5e; letter-spacing: 0.08em; }
      .tool { font: 700 26px "Source Serif 4", Georgia, serif; fill: #20241f; }
      .copy { font: 500 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #20241f; }
      .muted { font: 500 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #6e6a5e; }
      .rate { font: 700 22px Inter, ui-sans-serif, system-ui, sans-serif; fill: #2c5f4f; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="780"/>
  <rect x="48" y="32" width="1104" height="716" rx="12" fill="#ffffff" filter="url(#cardshadow)"/>
  <text x="88" y="88" class="title">Three names, three different bills</text>
  <text x="88" y="124" class="subtitle">Unified EU terms, effective Oct 1, 2026. Rates checked Sep 24, 2026.</text>

  <rect x="88" y="160" width="488" height="250" rx="10" fill="#e8efea" stroke="#2c5f4f" stroke-width="1.5"/>
  <text x="112" y="198" class="label">APP STORE / IN-APP PURCHASE</text>
  <text x="112" y="242" class="tool">15% or 26%</text>
  <text x="112" y="286" class="copy">15% in the Small Business Program,</text>
  <text x="112" y="310" class="copy">or a subscription after year one.</text>
  <text x="112" y="346" class="muted">Initial acquisition fee: eliminated.</text>
  <text x="112" y="370" class="muted">Store services fee: eliminated.</text>

  <rect x="608" y="160" width="488" height="250" rx="10" fill="#fbfaf7" stroke="#e7e2d7" stroke-width="1.5"/>
  <text x="632" y="198" class="label">LINK OUT / WITHIN 7 DAYS</text>
  <text x="632" y="242" class="tool">10% or 15%</text>
  <text x="632" y="286" class="copy">Store services commission, only on</text>
  <text x="632" y="310" class="copy">sales within 7 days of the link tap.</text>
  <text x="632" y="346" class="muted">10% for the reduced programs.</text>
  <text x="632" y="370" class="muted">This is not the old store services fee.</text>

  <rect x="88" y="436" width="1008" height="210" rx="10" fill="#fbfaf7" stroke="#e7e2d7" stroke-width="1.5"/>
  <text x="112" y="478" class="label">OUTSIDE THE APP STORE</text>
  <text x="112" y="526" class="tool">Core Technology Commission, 5%</text>
  <text x="112" y="570" class="copy">Alternative marketplaces and Web Distribution only. It is not the App Store rate.</text>
  <text x="112" y="606" class="muted">The old Core Technology Fee was 0.50 euro per first annual install above 1 million. A dollar cost needs an install count.</text>
</svg>

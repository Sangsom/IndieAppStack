<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">How a Dart error and a native crash reach the reporting SDK</title>
  <desc id="desc">Dart framework errors go through FlutterError.onError. Async Dart errors go through PlatformDispatcher.onError, or a zone on older Flutter. Native crashes and Android ANRs are captured by the Android or Apple SDK bundled in the Flutter plugin. Symbol files are uploaded beside the report so the dashboard can restore method names.</desc>
  <style>
    .title { font: 640 32px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20241f; }
    .sub { font: 500 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
    .tag { font: 700 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.06em; fill: #6e6a5e; }
    .name { font: 650 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20241f; }
    .copy { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374550; }
    .sink { font: 650 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20241f; }
  </style>
  <rect width="1200" height="780" fill="#fbfaf7"/>
  <text x="48" y="58" class="title">Dart errors and native crashes do not share a hook</text>
  <text x="48" y="90" class="sub">The Flutter plugin forwards both into one dashboard. You still wire the Dart hooks the vendor documents.</text>

  <rect x="48" y="128" width="250" height="120" rx="16" fill="#ffffff" stroke="#e7e2d7"/>
  <text x="68" y="164" class="tag">WIDGET TREE</text>
  <text x="68" y="196" class="name">Framework throw</text>
  <text x="68" y="222" class="copy">FlutterError.onError</text>

  <rect x="48" y="268" width="250" height="120" rx="16" fill="#ffffff" stroke="#e7e2d7"/>
  <text x="68" y="304" class="tag">FUTURE / ASYNC</text>
  <text x="68" y="336" class="name">Unhandled async</text>
  <text x="68" y="362" class="copy">PlatformDispatcher.onError</text>

  <rect x="48" y="408" width="250" height="120" rx="16" fill="#fff2dc" stroke="#e3b762"/>
  <text x="68" y="444" class="tag">ANDROID / IOS</text>
  <text x="68" y="476" class="name">Native crash or ANR</text>
  <text x="68" y="502" class="copy">Native SDK, not Dart</text>

  <path d="M298 188 H430" stroke="#7f8d96" stroke-width="3" fill="none"/>
  <path d="M298 328 H430" stroke="#7f8d96" stroke-width="3" fill="none"/>
  <path d="M298 468 H430" stroke="#7f8d96" stroke-width="3" fill="none"/>
  <path d="M430 188 V468" stroke="#7f8d96" stroke-width="3" fill="none"/>
  <path d="M430 328 H470" stroke="#7f8d96" stroke-width="3" fill="none"/>

  <rect x="470" y="250" width="280" height="156" rx="18" fill="#e8efea" stroke="#2c5f4f" stroke-width="2"/>
  <text x="490" y="292" class="tag">FLUTTER PLUGIN</text>
  <text x="490" y="330" class="sink">One SDK init</text>
  <text x="490" y="362" class="copy">Crashlytics, Sentry, Bugsnag,</text>
  <text x="490" y="384" class="copy">or Embrace</text>

  <path d="M750 328 H820" stroke="#7f8d96" stroke-width="3" fill="none"/>

  <rect x="820" y="250" width="332" height="156" rx="18" fill="#ffffff" stroke="#e7e2d7"/>
  <text x="840" y="292" class="tag">DASHBOARD</text>
  <text x="840" y="330" class="sink">Grouped issue</text>
  <text x="840" y="362" class="copy">Readable only after the symbol</text>
  <text x="840" y="384" class="copy">file for that build arrives.</text>

  <rect x="48" y="568" width="1104" height="150" rx="16" fill="#ffffff" stroke="#e7e2d7"/>
  <text x="72" y="608" class="name">What the init call does not do</text>
  <text x="72" y="644" class="copy">SentryFlutter.init and bugsnag.start install Dart handlers for you. Crashlytics documents the two assignments yourself.</text>
  <text x="72" y="672" class="copy">Embrace.instance.start is what that vendor says is required before Dart errors are captured. None of them upload symbols by existing.</text>
  <text x="72" y="700" class="copy">Handler behavior checked Nov 4, 2026 on the Firebase, Sentry, Bugsnag, and Embrace Flutter docs.</text>
</svg>

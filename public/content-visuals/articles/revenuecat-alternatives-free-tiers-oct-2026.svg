<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Where each free tier ends</title>
  <desc id="desc">Prices checked Oct 29, 2026. RevenueCat is free up to $2,500 MTR. Adapty is free while revenue is under $5,000. Qonversion is free at or under $7,000 MTR. Apphud is free up to $10,000 MTR. Superwall Indie is free up to $10,000 of paywall-attributed revenue, which is not the same meter. StoreKit 2 has no vendor fee.</desc>
  <defs>
    <style>
      .eyebrow { font: 700 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 1.6px; text-transform: uppercase; fill: #2c5f4f; }
      .title { font: 600 32px "Source Serif 4", Georgia, serif; fill: #20241f; }
      .dek { font: 400 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
      .name { font: 600 16px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20241f; }
      .meter { font: 500 13px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
      .value { font: 600 14px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #20241f; }
      .foot { font: 500 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
      .note { font: 600 16px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20241f; }
    </style>
  </defs>
  <rect width="1200" height="860" fill="#fbfaf7"/>
  <text x="48" y="48" class="eyebrow">Price ledger | checked Oct 29, 2026</text>
  <text x="48" y="92" class="title">Where the free tier ends</text>
  <text x="48" y="126" class="dek">Length is the published free ceiling. Superwall Indie is outlined because the meter is paywall-attributed revenue, not all tracked revenue.</text>
  <text x="48" y="150" class="dek">Adapty's bar is the "under $5,000" line from its pricing page. StoreKit 2 has no ceiling because there is no vendor fee.</text>
  <line x1="455.0" y1="200" x2="455.0" y2="680" stroke="#e7e2d7" stroke-dasharray="3 4"/>
  <line x1="610.0" y1="200" x2="610.0" y2="680" stroke="#e7e2d7" stroke-dasharray="3 4"/>
  <line x1="734.0" y1="200" x2="734.0" y2="680" stroke="#e7e2d7" stroke-dasharray="3 4"/>
  <line x1="920.0" y1="200" x2="920.0" y2="680" stroke="#e7e2d7" stroke-dasharray="3 4"/>
  <text x="48" y="228" class="name">RevenueCat</text>
  <text x="48" y="250" class="meter">MTR</text>
  <rect x="300" y="214" width="155.0" height="28" rx="4" fill="#9a6b23"/>
  <text x="467.0" y="233" class="value">$2,500 MTR</text>
  <text x="48" y="316" class="name">Adapty</text>
  <text x="48" y="338" class="meter">tracked revenue</text>
  <rect x="300" y="302" width="310.0" height="28" rx="4" fill="#2c5f4f"/>
  <text x="622.0" y="321" class="value">under $5,000</text>
  <text x="48" y="404" class="name">Qonversion</text>
  <text x="48" y="426" class="meter">MTR</text>
  <rect x="300" y="390" width="434.0" height="28" rx="4" fill="#20241f"/>
  <text x="746.0" y="409" class="value">$7,000 MTR</text>
  <text x="48" y="492" class="name">Apphud</text>
  <text x="48" y="514" class="meter">MTR</text>
  <rect x="300" y="478" width="620.0" height="28" rx="4" fill="#9e4434"/>
  <text x="932.0" y="497" class="value">$10,000 MTR</text>
  <text x="48" y="580" class="name">Superwall Indie</text>
  <text x="48" y="602" class="meter">MAR, paywall revenue only</text>
  <rect x="300" y="566" width="620.0" height="28" rx="4" fill="none" stroke="#6e6a5e" stroke-width="3"/>
  <text x="932.0" y="585" class="value">$10,000 MAR</text>
  <text x="48" y="668" class="note">StoreKit 2: no vendor fee, at any revenue.</text>
  <text x="48" y="724" class="foot">RevenueCat up to $2,500 MTR. Adapty under $5,000. Qonversion at or under $7,000 MTR. Apphud up to $10,000 MTR. Superwall Indie up to $10,000 MAR.</text>
  <text x="48" y="756" class="foot">Prices checked Oct 29, 2026 · vendor pricing pages</text>
  <text x="48" y="788" class="foot">Sources: revenuecat.com/pricing, adapty.io/pricing, qonversion.io/pricing, apphud.com/pricing, superwall.com/pricing, developer.apple.com/storekit.</text>
  <text x="48" y="820" class="foot">IndieAppStack chart. Recheck the vendor pages before you commit spend.</text>
</svg>

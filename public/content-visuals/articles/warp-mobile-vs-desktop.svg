<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="warpMobileTitle warpMobileDesc">
  <title id="warpMobileTitle">Warp on a computer versus a phone</title>
  <desc id="warpMobileDesc">Two columns. On a Mac or PC, Warp terminal runs on macOS, Windows, and Linux. On a phone, there is no Warp app. The Oz web app in a browser is for cloud agents only. Checked Oct 29, 2026.</desc>
  <defs>
    <filter id="warpMobileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#20241f" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #fbfaf7; }
      .headline { font: 700 40px "Source Serif 4", "Iowan Old Style", Georgia, serif; fill: #20241f; }
      .subhead { font: 400 20px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #6e6a5e; }
      .col { font: 700 24px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #fbfaf7; }
      .label { font: 700 22px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #20241f; }
      .row { font: 500 20px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #20241f; }
      .foot { font: 500 18px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #6e6a5e; }
      .eyebrow { font: 700 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #9a6b23; letter-spacing: 2px; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="675"/>

  <text class="eyebrow" x="60" y="58">INDIEAPPSTACK · FIELD GUIDE</text>
  <text class="headline" x="60" y="108">Where Warp actually runs</text>
  <text class="subhead" x="60" y="146">Desktop terminal on a computer. Browser-only cloud agents on a phone.</text>

  <rect x="60" y="184" width="516" height="400" rx="14" fill="#ffffff" stroke="#e7e2d7" stroke-width="1.5" filter="url(#warpMobileShadow)"/>
  <path d="M 74 184 h 488 a14 14 0 0 1 14 14 v 58 h -516 v -58 a14 14 0 0 1 14 -14 z" fill="#2c5f4f"/>
  <text class="col" x="88" y="228">On your Mac or PC</text>

  <text class="label" x="88" y="320">Warp terminal</text>
  <text class="row" x="88" y="364">macOS, Windows, and Linux</text>
  <text class="row" x="88" y="428">fastlane, git, xcodebuild, Gradle</text>
  <text class="row" x="88" y="492">A local shell session</text>

  <rect x="624" y="184" width="516" height="400" rx="14" fill="#ffffff" stroke="#e7e2d7" stroke-width="1.5" filter="url(#warpMobileShadow)"/>
  <path d="M 638 184 h 488 a14 14 0 0 1 14 14 v 58 h -516 v -58 a14 14 0 0 1 14 -14 z" fill="#20241f"/>
  <text class="col" x="652" y="228">On your phone</text>

  <text class="label" x="652" y="320">No Warp app</text>
  <text class="row" x="652" y="364">Oz web app in a browser</text>
  <text class="row" x="652" y="428">Cloud agents only</text>
  <text class="row" x="652" y="492">No local terminal session</text>

  <text class="foot" x="60" y="640">Checked Oct 29, 2026 · warp.dev/download, docs.warp.dev</text>
</svg>

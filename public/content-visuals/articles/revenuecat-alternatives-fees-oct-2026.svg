  <text x="72" y="594" class="legend">RevenueCat</text>
  <text x="438" y="594" class="cell" text-anchor="middle">$30</text>
  <text x="626" y="594" class="cell" text-anchor="middle">$80</text>
  <text x="814" y="594" class="cell" text-anchor="middle">$150</text>
  <text x="1002" y="594" class="cell" text-anchor="middle">$500</text>
  
  <text x="72" y="630" class="legend">Adapty</text>
  <text x="438" y="630" class="cell" text-anchor="middle">$0</text>
  <text x="626" y="630" class="cell" text-anchor="middle">$80</text>
  <text x="814" y="630" class="cell" text-anchor="middle">$150</text>
  <text x="1002" y="630" class="cell" text-anchor="middle">$500</text>
  <rect x="56" y="644" width="1088" height="36" fill="#f7f4ee"/>
  <text x="72" y="666" class="legend">Qonversion</text>
  <text x="438" y="666" class="cell" text-anchor="middle">$0</text>
  <text x="626" y="666" class="cell" text-anchor="middle">$64</text>
  <text x="814" y="666" class="cell" text-anchor="middle">$120</text>
  <text x="1002" y="666" class="cell" text-anchor="middle">$400</text>
  
  <text x="72" y="702" class="legend">Apphud Free→Pro</text>
  <text x="438" y="702" class="cell" text-anchor="middle">$0</text>
  <text x="626" y="702" class="cell" text-anchor="middle">$0</text>
  <text x="814" y="702" class="cell" text-anchor="middle">$148.50</text>
  <text x="1002" y="702" class="cell" text-anchor="middle">$495</text>
  <rect x="56" y="716" width="1088" height="36" fill="#f7f4ee"/>
  <text x="72" y="738" class="legend">StoreKit 2</text>
  <text x="438" y="738" class="cell" text-anchor="middle">$0</text>
  <text x="626" y="738" class="cell" text-anchor="middle">$0</text>
  <text x="814" y="738" class="cell" text-anchor="middle">$0</text>
  <text x="1002" y="738" class="cell" text-anchor="middle">$0</text>
  <text x="64" y="792" class="foot">RevenueCat: $0 at or under $2,500 MTR, otherwise 1% of the whole MTR. Adapty: $0 under $5,000, otherwise 1% of monthly tracked revenue.</text>
  <text x="64" y="816" class="foot">Qonversion: $0 at or under $7,000 MTR, otherwise 0.8% of total MTR. The $64 and $400 cells are the pricing page's own examples.</text>
  <text x="64" y="840" class="foot">Apphud Free→Pro: $0 at or under $10,000 MTR, otherwise the greater of $49 and 0.99% of MTR. The $49 floor does not change the $15,000 or $50,000 cells.</text>
  <text x="64" y="864" class="foot">StoreKit 2: $0 vendor fee. Other cells are arithmetic on the published rates, not invoices.</text>
  <text x="64" y="900" class="foot">Prices checked Oct 29, 2026 · vendor pricing pages</text>
  <text x="64" y="928" class="foot">Sources: revenuecat.com/pricing, RevenueCat billing docs, adapty.io/pricing, qonversion.io/pricing, apphud.com/pricing, developer.apple.com/storekit.</text>
  <text x="64" y="956" class="foot">IndieAppStack chart. Recheck the vendor pages before you commit spend.</text>
</svg>

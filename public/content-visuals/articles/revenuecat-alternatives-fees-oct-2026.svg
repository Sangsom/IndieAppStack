<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
  <title id="title">Monthly vendor fee at four revenue levels</title>
  <desc id="desc">Prices checked Oct 29, 2026. At $3,000, $8,000, $15,000, and $50,000 of monthly tracked revenue, the bars are RevenueCat at 1% after $2,500, Adapty at 1% after $5,000, Qonversion at 0.8% after $7,000, Apphud on the Free plan through $10,000 then Pro at 0.99% with a $49 minimum, and StoreKit 2 at no vendor fee. Qonversion's $64 and $400 match the pricing page examples. The other cells are arithmetic on the published rates, not invoices.</desc>
  <defs>
    <style>
      .eyebrow { font: 700 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 1.6px; text-transform: uppercase; fill: #2c5f4f; }
      .title { font: 600 32px "Source Serif 4", Georgia, serif; fill: #20241f; }
      .dek { font: 400 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
      .tick { font: 500 13px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
      .legend { font: 600 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20241f; }
      .group { font: 600 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20241f; }
      .cell { font: 600 14px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #20241f; }
      .foot { font: 500 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
    </style>
  </defs>
  <rect width="1200" height="1040" fill="#fbfaf7"/>
  <text x="64" y="48" class="eyebrow">Price ledger | checked Oct 29, 2026</text>
  <text x="64" y="92" class="title">Monthly vendor fee at four revenue levels</text>
  <text x="64" y="124" class="dek">One number, treated as monthly tracked revenue. Superwall is not on this chart: its 1% applies only to paywall-attributed revenue.</text>
  <text x="64" y="146" class="dek">A $0 bar is a 4px cap. Read the table for the figure. Not an invoice.</text>
  <rect x="64" y="162" width="14" height="14" rx="2" fill="#9a6b23"/>
  <text x="86" y="174" class="legend">RevenueCat</text>
  <rect x="284" y="162" width="14" height="14" rx="2" fill="#2c5f4f"/>
  <text x="306" y="174" class="legend">Adapty</text>
  <rect x="504" y="162" width="14" height="14" rx="2" fill="#20241f"/>
  <text x="526" y="174" class="legend">Qonversion</text>
  <rect x="724" y="162" width="14" height="14" rx="2" fill="#9e4434"/>
  <text x="746" y="174" class="legend">Apphud Free→Pro</text>
  <rect x="944" y="162" width="14" height="14" rx="2" fill="#6e6a5e"/>
  <text x="966" y="174" class="legend">StoreKit 2</text>
  <rect x="56" y="198" width="1088" height="312" rx="7" fill="#ffffff" stroke="#e7e2d7"/>
  <line x1="64" y1="468.0" x2="1136" y2="468.0" stroke="#e7e2d7"/>
  <text x="54" y="472.0" class="tick" text-anchor="end">$0</text>
  <line x1="64" y1="417.2" x2="1136" y2="417.2" stroke="#e7e2d7"/>
  <text x="54" y="421.2" class="tick" text-anchor="end">$100</text>
  <line x1="64" y1="341.0" x2="1136" y2="341.0" stroke="#e7e2d7"/>
  <text x="54" y="345.0" class="tick" text-anchor="end">$250</text>
  <line x1="64" y1="214.0" x2="1136" y2="214.0" stroke="#e7e2d7"/>
  <text x="54" y="218.0" class="tick" text-anchor="end">$500</text>
  <rect x="97.0" y="452.8" width="34" height="15.2" rx="3" fill="#9a6b23"/>
  <rect x="139.0" y="464.0" width="34" height="4.0" rx="3" fill="#2c5f4f"/>
  <rect x="181.0" y="464.0" width="34" height="4.0" rx="3" fill="#20241f"/>
  <rect x="223.0" y="464.0" width="34" height="4.0" rx="3" fill="#9e4434"/>
  <rect x="265.0" y="464.0" width="34" height="4.0" rx="3" fill="#6e6a5e"/>
  <text x="198.0" y="496" class="group" text-anchor="middle">$3,000 MTR</text>
  <rect x="365.0" y="427.4" width="34" height="40.6" rx="3" fill="#9a6b23"/>
  <rect x="407.0" y="427.4" width="34" height="40.6" rx="3" fill="#2c5f4f"/>
  <rect x="449.0" y="435.5" width="34" height="32.5" rx="3" fill="#20241f"/>
  <rect x="491.0" y="464.0" width="34" height="4.0" rx="3" fill="#9e4434"/>
  <rect x="533.0" y="464.0" width="34" height="4.0" rx="3" fill="#6e6a5e"/>
  <text x="466.0" y="496" class="group" text-anchor="middle">$8,000 MTR</text>
  <rect x="633.0" y="391.8" width="34" height="76.2" rx="3" fill="#9a6b23"/>
  <rect x="675.0" y="391.8" width="34" height="76.2" rx="3" fill="#2c5f4f"/>
  <rect x="717.0" y="407.0" width="34" height="61.0" rx="3" fill="#20241f"/>
  <rect x="759.0" y="392.6" width="34" height="75.4" rx="3" fill="#9e4434"/>
  <rect x="801.0" y="464.0" width="34" height="4.0" rx="3" fill="#6e6a5e"/>
  <text x="734.0" y="496" class="group" text-anchor="middle">$15,000 MTR</text>
  <rect x="901.0" y="214.0" width="34" height="254.0" rx="3" fill="#9a6b23"/>
  <rect x="943.0" y="214.0" width="34" height="254.0" rx="3" fill="#2c5f4f"/>
  <rect x="985.0" y="264.8" width="34" height="203.2" rx="3" fill="#20241f"/>
  <rect x="1027.0" y="216.5" width="34" height="251.5" rx="3" fill="#9e4434"/>
  <rect x="1069.0" y="464.0" width="34" height="4.0" rx="3" fill="#6e6a5e"/>
  <text x="1002.0" y="496" class="group" text-anchor="middle">$50,000 MTR</text>
  <text x="600" y="522" class="tick" text-anchor="middle">Monthly tracked revenue</text>
  <rect x="56" y="536" width="1088" height="216" rx="7" fill="#ffffff" stroke="#e7e2d7"/>
  <text x="72" y="558" class="tick">Option</text>
  <text x="438" y="558" class="tick" text-anchor="middle">$3,000</text>
  <text x="626" y="558" class="tick" text-anchor="middle">$8,000</text>
  <text x="814" y="558" class="tick" text-anchor="middle">$15,000</text>
  <text x="1002" y="558" class="tick" text-anchor="middle">$50,000</text>

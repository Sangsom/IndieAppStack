<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Crash reporting tool decision</title>
  <desc id="desc">A decision diagram that routes a Firebase app to Crashlytics and a cross-stack app to Sentry. The crash-reporting category lists those two tools.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#15202b" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="9" refY="3" viewBox="0 0 10 6">
      <path d="M0,0 L10,3 L0,6 Z" fill="#7f8d96"/>
    </marker>
    <style>
      .title { font: 760 40px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20241f; }
      .subtitle { font: 500 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
      .tag { font: 740 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6c76; letter-spacing: 1px; }
      .brand { font: 760 28px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20241f; }
      .copy { font: 520 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374550; }
      .small { font: 520 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #66737d; }
      .q { font: 650 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20241f; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fbfaf7"/>
  <rect x="48" y="36" width="1104" height="648" rx="34" fill="#ffffff" filter="url(#shadow)"/>
  <text x="88" y="96" class="title">Pick by the stack you already have</text>
  <text x="90" y="132" class="subtitle">The crash-reporting category lists Firebase and Sentry. Checked Oct 20, 2026.</text>

  <rect x="300" y="168" width="600" height="88" rx="22" fill="#e8efea" stroke="#2c5f4f" stroke-width="2"/>
  <text x="600" y="206" class="q" text-anchor="middle">Where do crashes need to be read?</text>
  <text x="600" y="232" class="small" text-anchor="middle">One owner. Install it before the first external build.</text>

  <line x1="450" y1="256" x2="280" y2="330" stroke="#7f8d96" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="750" y1="256" x2="920" y2="330" stroke="#7f8d96" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="88" y="340" width="400" height="250" rx="26" fill="#fff2dc" stroke="#e3b762" stroke-width="2"/>
  <text x="116" y="384" class="tag">FIREBASE APP</text>
  <text x="116" y="428" class="brand">Crashlytics</text>
  <text x="116" y="470" class="copy">Mobile crashes in the Firebase console.</text>
  <text x="116" y="498" class="copy">No separate Crashlytics charge on</text>
  <text x="116" y="522" class="copy">Spark or Blaze.</text>
  <text x="116" y="560" class="small">Apple, Android, Flutter, and Unity.</text>

  <rect x="712" y="340" width="400" height="250" rx="26" fill="#e9f2ff" stroke="#91b8e8" stroke-width="2"/>
  <text x="740" y="384" class="tag">CROSS-STACK</text>
  <text x="740" y="428" class="brand">Sentry</text>
  <text x="740" y="470" class="copy">Mobile, backend, and web errors</text>
  <text x="740" y="494" class="copy">in one issue list.</text>
  <text x="740" y="530" class="copy">Developer plan is $0 for one user.</text>
  <text x="740" y="560" class="small">Includes an official React Native SDK.</text>

  <text x="88" y="640" class="small">Bugsnag, Instabug, Embrace, and Measure are not in this category, so they are not on this diagram.</text>
</svg>

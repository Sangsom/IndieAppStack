<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Custom StoreKit 2 paywall flow</title>
  <desc id="desc">Four steps in a custom iOS paywall: load StoreKit 2 products, show your SwiftUI paywall, purchase, then verify the transaction and unlock. SubscriptionStoreView can replace the screen in step 2. No vendor fee. Apple documentation opened Oct 29, 2026.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#15202b" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="9" refY="3" viewBox="0 0 10 6">
      <path d="M0,0 L10,3 L0,6 Z" fill="#7f8d96"/>
    </marker>
    <style>
      .title { font: 760 36px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .subtitle { font: 500 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #60707a; }
      .step { font: 760 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .tag { font: 740 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6c76; letter-spacing: 1px; }
      .copy { font: 520 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374550; }
      .small { font: 520 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #66737d; }
      .num { font: 800 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .foot { font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #66737d; }
    </style>
  </defs>
  <rect width="1200" height="675" fill="#f6f8f7"/>
  <rect x="40" y="36" width="1120" height="604" rx="34" fill="#ffffff" filter="url(#shadow)"/>
  <text x="72" y="92" class="title">A custom StoreKit 2 paywall</text>
  <text x="74" y="126" class="subtitle">Four steps you own when the screen stays in the app.</text>

  <rect x="72" y="168" width="228" height="300" rx="26" fill="#e8f5ef" stroke="#76bd8c" stroke-width="2"/>
  <circle cx="104" cy="206" r="16" fill="#2f8f63"/>
  <text x="98" y="212" class="num">1</text>
  <text x="130" y="211" class="tag">LOAD</text>
  <text x="96" y="264" class="step">Load Products</text>
  <text x="96" y="308" class="copy">Product.products(for:)</text>
  <text x="96" y="332" class="copy">with the identifiers</text>
  <text x="96" y="356" class="copy">from App Store Connect.</text>
  <text x="96" y="412" class="small">StoreKit returns</text>
  <text x="96" y="432" class="small">each Product.</text>

  <line x1="308" y1="318" x2="340" y2="318" stroke="#7f8d96" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="348" y="168" width="228" height="300" rx="26" fill="#fff2dc" stroke="#e3b762" stroke-width="2"/>
  <circle cx="380" cy="206" r="16" fill="#bf8430"/>
  <text x="374" y="212" class="num">2</text>
  <text x="406" y="211" class="tag">SHOW</text>
  <text x="372" y="258" class="step">Show your</text>
  <text x="372" y="286" class="step">SwiftUI paywall</text>
  <text x="372" y="328" class="copy">Name, description,</text>
  <text x="372" y="352" class="copy">price, and the</text>
  <text x="372" y="376" class="copy">subscribe button.</text>
  <text x="372" y="432" class="small">Your layout.</text>

  <line x1="584" y1="318" x2="616" y2="318" stroke="#7f8d96" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="624" y="168" width="228" height="300" rx="26" fill="#e9f2ff" stroke="#91b8e8" stroke-width="2"/>
  <circle cx="656" cy="206" r="16" fill="#407db9"/>
  <text x="650" y="212" class="num">3</text>
  <text x="682" y="211" class="tag">PURCHASE</text>
  <text x="648" y="264" class="step">Purchase</text>
  <text x="648" y="308" class="copy">purchase(options:)</text>
  <text x="648" y="332" class="copy">on this device.</text>
  <text x="648" y="376" class="small">Same-device result is</text>
  <text x="648" y="398" class="small">PurchaseResult.success.</text>

  <line x1="860" y1="318" x2="892" y2="318" stroke="#7f8d96" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="900" y="168" width="228" height="300" rx="26" fill="#f3eee6" stroke="#c4a574" stroke-width="2"/>
  <circle cx="932" cy="206" r="16" fill="#9a6b23"/>
  <text x="926" y="212" class="num">4</text>
  <text x="958" y="211" class="tag">VERIFY</text>
  <text x="924" y="258" class="step">Verify and</text>
  <text x="924" y="286" class="step">unlock</text>
  <text x="924" y="328" class="copy">Read currentEntitlement,</text>
  <text x="924" y="352" class="copy">then call finish().</text>
  <text x="924" y="392" class="small">Transaction.updates</text>
  <text x="924" y="414" class="small">covers other devices.</text>

  <text x="72" y="532" class="foot">SubscriptionStoreView can replace the screen in step 2. It does not add a vendor fee or a remote test.</text>
  <text x="72" y="560" class="foot">Apple documentation opened Oct 29, 2026.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Adapty versus Superwall by the job each one meters</title>
  <desc id="desc">Checked Oct 20, 2026. Adapty is the subscription backend plus paywall builder, billed at 1% of tracked revenue after $5,000. Superwall is the paywall experiment layer. Its infrastructure is $0 at any scale, and Indie paywalls are $0 up to $10,000 of paywall-attributed revenue, then 1% of that attributed total.</desc>
  <defs>
    <style>
      .eyebrow { font: 700 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 1.6px; text-transform: uppercase; fill: #2c5f4f; }
      .title { font: 600 32px "Source Serif 4", Georgia, serif; fill: #20241f; }
      .dek { font: 400 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
      .cardlabel { font: 700 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 1.2px; text-transform: uppercase; fill: #2c5f4f; }
      .cardtitle { font: 600 28px "Source Serif 4", Georgia, serif; fill: #20241f; }
      .row { font: 500 16px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20241f; }
      .muted { font: 500 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
      .foot { font: 500 13px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
    </style>
  </defs>
  <rect width="1200" height="640" fill="#fbfaf7"/>
  <text x="48" y="44" class="eyebrow">Decision | checked Oct 20, 2026</text>
  <text x="48" y="88" class="title">One bundle, or a paywall layer</text>
  <text x="48" y="118" class="dek">Both can own purchases. The meter follows a different base. Choose the job you will run this month.</text>

  <rect x="48" y="152" width="528" height="390" rx="7" fill="#ffffff" stroke="#e7e2d7"/>
  <text x="72" y="188" class="cardlabel">Tracked revenue</text>
  <text x="72" y="230" class="cardtitle">Adapty</text>
  <text x="72" y="278" class="row">Subscription backend</text>
  <text x="72" y="308" class="row">Flow and paywall builder</text>
  <text x="72" y="338" class="row">Experiments and revenue analytics</text>
  <line x1="72" y1="368" x2="536" y2="368" stroke="#e7e2d7"/>
  <text x="72" y="408" class="muted">$0 up to $5,000 a month, then 1% of</text>
  <text x="72" y="434" class="muted">that month's tracked revenue.</text>
  <text x="72" y="470" class="muted">The 1% follows revenue Adapty tracks,</text>
  <text x="72" y="496" class="muted">including sales that never started as a test.</text>

  <rect x="624" y="152" width="528" height="390" rx="7" fill="#ffffff" stroke="#e7e2d7"/>
  <text x="648" y="188" class="cardlabel">Paywall-attributed revenue</text>
  <text x="648" y="230" class="cardtitle">Superwall</text>
  <text x="648" y="278" class="row">Remote paywall experiments</text>
  <text x="648" y="308" class="row">Campaigns, audiences, templates</text>
  <text x="648" y="338" class="row">Infrastructure priced at $0</text>
  <line x1="648" y1="368" x2="1112" y2="368" stroke="#e7e2d7"/>
  <text x="648" y="408" class="muted">Entitlements, purchases, webhooks, and</text>
  <text x="648" y="434" class="muted">SQL access stay $0 at any scale.</text>
  <text x="648" y="470" class="muted">Indie paywalls are $0 up to $10,000 MAR,</text>
  <text x="648" y="496" class="muted">then 1% of that attributed total only.</text>

  <text x="48" y="586" class="foot">Sources: adapty.io/pricing and superwall.com/pricing. Retrieved Oct 20, 2026.</text>
  <text x="48" y="612" class="foot">IndieAppStack conceptual chart. A documented pair with RevenueCat is a separate page. Superwall on Adapty is a migration overlap, not this diagram.</text>
</svg>

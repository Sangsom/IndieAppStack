<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Which app monetization tool fits the app</title>
  <desc id="desc">Subscription consumer and casual game apps use RevenueCat with Superwall. Content and B2B apps use RevenueCat. Free utility and pre-launch apps skip a purchase SDK until they charge. Prices checked Sep 25, 2026.</desc>
  <defs>
    <filter id="cardshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#20241f" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #fbfaf7; }
      .title { font: 700 34px "Source Serif 4", Georgia, serif; fill: #20241f; }
      .subtitle { font: 500 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #6e6a5e; }
      .label { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #6e6a5e; letter-spacing: 0.08em; }
      .tool { font: 700 24px "Source Serif 4", Georgia, serif; fill: #20241f; }
      .copy { font: 500 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #20241f; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="640"/>
  <rect x="48" y="28" width="1104" height="584" rx="12" fill="#ffffff" filter="url(#cardshadow)"/>
  <text x="88" y="84" class="title">Pick the tool by the app, not the percentage</text>
  <text x="88" y="118" class="subtitle">Vendor prices checked Sep 25, 2026. Apple's commission is a separate bill.</text>

  <rect x="88" y="156" width="488" height="180" rx="10" fill="#e8efea" stroke="#2c5f4f" stroke-width="1.5"/>
  <text x="112" y="192" class="label">SUBSCRIPTION APP OR CASUAL GAME</text>
  <text x="112" y="236" class="tool">RevenueCat and Superwall</text>
  <text x="112" y="274" class="copy">RevenueCat owns entitlements.</text>
  <text x="112" y="298" class="copy">Superwall owns remote paywall tests.</text>

  <rect x="608" y="156" width="488" height="180" rx="10" fill="#fbfaf7" stroke="#e7e2d7" stroke-width="1.5"/>
  <text x="632" y="192" class="label">CONTENT, COMMUNITY, OR B2B</text>
  <text x="632" y="236" class="tool">RevenueCat</text>
  <text x="632" y="274" class="copy">Add it when access depends on a</text>
  <text x="632" y="298" class="copy">subscription. The backend stays separate.</text>

  <rect x="88" y="364" width="1008" height="180" rx="10" fill="#fbfaf7" stroke="#e7e2d7" stroke-width="1.5"/>
  <text x="112" y="404" class="label">FREE UTILITY OR PRE-LAUNCH</text>
  <text x="112" y="452" class="tool">No purchase SDK yet</text>
  <text x="112" y="490" class="copy">StoreKit 2 is enough for one iOS unlock. A waitlist does not need a monetization tool.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">RevenueCat and Superwall fees depend on different revenue bases</title>
  <desc id="desc">Checked Sep 27, 2026. At $10,000 on both meters, RevenueCat Pro is $100 and Superwall Indie is $0. On a $50,000 month, Superwall's published example is $0 when none of it goes through a Superwall paywall, and 1% of $25,000 when half does. The $250 and $500 figures are that rate applied, not a printed invoice. RevenueCat is $500 if it tracks the full $50,000.</desc>
  <defs>
    <style>
      .eyebrow { font: 700 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 1.6px; text-transform: uppercase; fill: #2c5f4f; }
      .title { font: 600 32px "Source Serif 4", Georgia, serif; fill: #20241f; }
      .dek { font: 400 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
      .cardlabel { font: 700 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 1.2px; text-transform: uppercase; fill: #2c5f4f; }
      .cardtitle { font: 600 22px "Source Serif 4", Georgia, serif; fill: #20241f; }
      .row { font: 500 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20241f; }
      .money { font: 600 15px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #20241f; }
      .muted { font: 500 13px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
      .foot { font: 500 12px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fbfaf7"/>
  <text x="56" y="44" class="eyebrow">Price ledger | checked Sep 27, 2026</text>
  <text x="56" y="86" class="title">The 1% is not the same 1%</text>
  <text x="56" y="116" class="dek">RevenueCat bills monthly tracked revenue. Superwall Indie bills paywall-attributed revenue. Figures are the published rates, not invoices.</text>

  <rect x="56" y="148" width="528" height="470" rx="7" fill="#ffffff" stroke="#e7e2d7"/>
  <text x="80" y="184" class="cardlabel">Aligned month</text>
  <text x="80" y="220" class="cardtitle">$10,000 on both meters</text>
  <text x="80" y="258" class="row">RevenueCat Pro</text>
  <text x="430" y="258" class="money">$100</text>
  <text x="80" y="284" class="muted">1% of $10,000 MTR. The whole amount, not the overflow.</text>
  <line x1="80" y1="312" x2="540" y2="312" stroke="#e7e2d7"/>
  <text x="80" y="348" class="row">Superwall Indie</text>
  <text x="430" y="348" class="money">$0</text>
  <text x="80" y="374" class="muted">Still inside the $10,000 MAR band.</text>
  <text x="80" y="430" class="muted">Infrastructure on Superwall stays $0 either way.</text>
  <text x="80" y="456" class="muted">Startup is a different bill: $49 per month</text>
  <text x="80" y="478" class="muted">plus 1% of MAR, with no $10,000 band on that card.</text>
  <text x="80" y="560" class="muted">At $2,500 MTR, RevenueCat is also $0.</text>
  <text x="80" y="584" class="muted">RevenueCat's own next step is $2,600 MTR = $26.</text>

  <rect x="616" y="148" width="528" height="470" rx="7" fill="#ffffff" stroke="#e7e2d7"/>
  <text x="640" y="184" class="cardlabel">Superwall's published example</text>
  <text x="640" y="220" class="cardtitle">A $50,000 month</text>
  <text x="640" y="262" class="muted">If RevenueCat tracks all $50,000, its Pro bill is $500</text>
  <text x="640" y="284" class="muted">in every row below.</text>

  <text x="640" y="330" class="row">None through its paywall</text>
  <text x="1104" y="330" class="money" text-anchor="end">$0</text>
  <text x="640" y="354" class="muted">Superwall bills nothing on that month.</text>

  <text x="640" y="400" class="row">Half through its paywall</text>
  <text x="1104" y="400" class="money" text-anchor="end">$250</text>
  <text x="640" y="424" class="muted">1% of $25,000. The other $25,000 stays free.</text>

  <text x="640" y="470" class="row">All of it through its paywall</text>
  <text x="1104" y="470" class="money" text-anchor="end">$500</text>
  <text x="640" y="494" class="muted">1% of total MAR. Infrastructure is still $0.</text>

  <text x="640" y="560" class="muted">The $0 row is Superwall's illustration.</text>
  <text x="640" y="584" class="muted">$250 is 1% of their $25,000 example, calculated.</text>

  <text x="56" y="660" class="foot">Sources: revenuecat.com/pricing, RevenueCat billing docs, superwall.com/pricing. Retrieved Sep 27, 2026.</text>
  <text x="56" y="684" class="foot">IndieAppStack conceptual chart. Recheck official pages before committing spend.</text>
</svg>

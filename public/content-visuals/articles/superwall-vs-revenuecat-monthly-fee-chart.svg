<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Estimated monthly fees for RevenueCat and Superwall Indie</title>
  <desc id="desc">Checked Oct 25, 2026. From $0 to $50,000 in monthly revenue, RevenueCat is $0 through $2,500 of monthly tracked revenue, then 1% of the whole amount. Superwall Indie is $0 through $10,000 of monthly attributed revenue, then 1% of the total, assuming every dollar went through a Superwall paywall. Above $10,000 the lines meet. Arithmetic from published rates, not invoices.</desc>
  <defs>
    <style>
      .eyebrow { font: 700 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 1.6px; text-transform: uppercase; fill: #2c5f4f; }
      .title { font: 600 32px "Source Serif 4", Georgia, serif; fill: #20241f; }
      .dek { font: 400 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
      .tick { font: 500 13px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
      .guide { font: 600 12px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
      .legend { font: 600 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20241f; }
      .note { font: 500 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20241f; }
      .foot { font: 500 13px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
      .point { font: 600 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #20241f; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#fbfaf7"/>
  <text x="48" y="44" class="eyebrow">Price ledger | checked Oct 25, 2026</text>
  <text x="48" y="88" class="title">Monthly fee against monthly revenue</text>
  <text x="48" y="122" class="dek">Whole amount on both meters. The step is 1% of the whole month, not 1% of only the overflow.</text>
  <text x="48" y="146" class="dek">Superwall Indie assumes every dollar went through a Superwall paywall. Not an invoice.</text>

  <line x1="48" y1="176" x2="96" y2="176" stroke="#9a6b23" stroke-width="3"/>
  <text x="106" y="181" class="legend">RevenueCat</text>
  <line x1="230" y1="176" x2="278" y2="176" stroke="#2c5f4f" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="288" y="181" class="legend">Superwall Indie</text>

  <rect x="56" y="204" width="1088" height="430" rx="7" fill="#ffffff" stroke="#e7e2d7"/>
  <line x1="108" y1="548.0" x2="1128" y2="548.0" stroke="#e7e2d7"/>
  <text x="96" y="552.0" class="tick" text-anchor="end">$0</text>
  <line x1="108" y1="489.8" x2="1128" y2="489.8" stroke="#e7e2d7"/>
  <text x="96" y="493.8" class="tick" text-anchor="end">$100</text>
  <line x1="108" y1="431.6" x2="1128" y2="431.6" stroke="#e7e2d7"/>
  <text x="96" y="435.6" class="tick" text-anchor="end">$200</text>
  <line x1="108" y1="373.5" x2="1128" y2="373.5" stroke="#e7e2d7"/>
  <text x="96" y="377.5" class="tick" text-anchor="end">$300</text>
  <line x1="108" y1="315.3" x2="1128" y2="315.3" stroke="#e7e2d7"/>
  <text x="96" y="319.3" class="tick" text-anchor="end">$400</text>
  <line x1="108" y1="257.1" x2="1128" y2="257.1" stroke="#e7e2d7"/>
  <text x="96" y="261.1" class="tick" text-anchor="end">$500</text>
  <text x="108.0" y="578" class="tick" text-anchor="middle">$0</text>
  <text x="312.0" y="578" class="tick" text-anchor="middle">$10k</text>
  <text x="516.0" y="578" class="tick" text-anchor="middle">$20k</text>
  <text x="720.0" y="578" class="tick" text-anchor="middle">$30k</text>
  <text x="924.0" y="578" class="tick" text-anchor="middle">$40k</text>
  <text x="1128.0" y="578" class="tick" text-anchor="middle">$50k</text>
  <text x="618" y="602" class="tick" text-anchor="middle">Monthly revenue</text>
  <text transform="rotate(-90 36 388)" x="36" y="388" class="tick" text-anchor="middle">Monthly fee</text>

  <line x1="159.0" y1="228" x2="159.0" y2="548" stroke="#e7e2d7" stroke-dasharray="3 4"/>
  <text x="167.0" y="246" class="guide">RevenueCat free line</text>
  <line x1="312.0" y1="228" x2="312.0" y2="548" stroke="#e7e2d7" stroke-dasharray="3 4"/>
  <text x="320.0" y="246" class="guide">Superwall free line</text>

  <polyline points="108.0,548.0 159.0,548.0 159.0,533.5 1128.0,257.1" fill="none" stroke="#9a6b23" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="108.0,548.0 312.0,548.0 312.0,489.8 1128.0,257.1" fill="none" stroke="#2c5f4f" stroke-width="3" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/>

  <text x="230.4" y="454.9" class="point" text-anchor="middle">1% of all MTR</text>
  <text x="720.0" y="357.5" class="point" text-anchor="middle">Both 1% of the whole</text>
  <text x="1118.0" y="243.1" class="point" text-anchor="end">$500</text>

  <text x="72" y="652" class="note">After $10,000 the lines meet: both are 1% of the whole amount when every dollar is on both meters.</text>
  <text x="48" y="700" class="foot">Arithmetic from published rates, checked Oct 25, 2026; not invoices. Sources: revenuecat.com/pricing, RevenueCat billing docs, superwall.com/pricing.</text>
  <text x="48" y="724" class="foot">At $10,000, RevenueCat is $100 and Superwall Indie is $0. At $50,000 both are $500. IndieAppStack chart. Recheck the vendor pages before committing spend.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Paywall app fees at $8,000 and $50,000 monthly revenue</title>
  <desc id="desc">Calculated monthly fees checked Oct 15, 2026. At $8,000: RevenueCat $80, Adapty $80, Superwall Indie $0, Qonversion $64. At $50,000: RevenueCat $500, Adapty $500, Superwall Indie $500 if all revenue is paywall-attributed, Qonversion $400. Qonversion's $64 and $400 are published examples. The other amounts are 1 percent calculations, not invoices.</desc>
  <defs>
    <style>
      .eyebrow { font: 700 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 1.6px; text-transform: uppercase; fill: #2c5f4f; }
      .title { font: 600 32px "Source Serif 4", Georgia, serif; fill: #20241f; }
      .dek { font: 400 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
      .axis { font: 500 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #6e6a5e; }
      .label { font: 600 18px "Source Serif 4", Georgia, serif; fill: #20241f; }
      .value { font: 600 14px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #20241f; }
      .legend { font: 500 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20241f; }
      .foot { font: 500 13px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fbfaf7"/>
  <text x="56" y="48" class="eyebrow">Price ledger | checked Oct 15, 2026</text>
  <text x="56" y="92" class="title">What the meters cost at two revenue levels</text>
  <text x="56" y="124" class="dek">Qonversion publishes $64 at $8,000 and $400 at $50,000. RevenueCat and Adapty bars are 1% of the row.</text>
  <text x="56" y="146" class="dek">Superwall Indie is $0 through $10,000 of paywall-attributed revenue. The $50,000 bar assumes every dollar is attributed.</text>

  <rect x="56" y="172" width="16" height="16" fill="#2c5f4f"/>
  <text x="80" y="185" class="legend">RevenueCat</text>
  <rect x="200" y="172" width="16" height="16" fill="#9a6b23"/>
  <text x="224" y="185" class="legend">Adapty</text>
  <rect x="320" y="172" width="16" height="16" fill="#6e6a5e"/>
  <text x="344" y="185" class="legend">Superwall Indie</text>
  <rect x="500" y="172" width="16" height="16" fill="#20241f"/>
  <text x="524" y="185" class="legend">Qonversion</text>

  <!-- plot: baseline y=560, $500 = 300px, so y for value = 560 - value*0.6 -->
  <line x1="120" y1="240" x2="1120" y2="240" stroke="#e7e2d7" stroke-width="1"/>
  <line x1="120" y1="400" x2="1120" y2="400" stroke="#e7e2d7" stroke-width="1"/>
  <line x1="120" y1="560" x2="1120" y2="560" stroke="#e7e2d7" stroke-width="1"/>
  <text x="108" y="244" class="axis" text-anchor="end">$500</text>
  <text x="108" y="404" class="axis" text-anchor="end">$250</text>
  <text x="108" y="564" class="axis" text-anchor="end">$0</text>

  <text x="390" y="600" class="label" text-anchor="middle">$8,000 / month</text>
  <!-- RC $80 = 48px, y=512 -->
  <rect x="250" y="512" width="52" height="48" fill="#2c5f4f"/>
  <text x="276" y="504" class="value" text-anchor="middle">$80</text>
  <!-- Adapty $80 -->
  <rect x="318" y="512" width="52" height="48" fill="#9a6b23"/>
  <text x="344" y="504" class="value" text-anchor="middle">$80</text>
  <!-- Superwall $0: tick on the baseline -->
  <rect x="386" y="556" width="52" height="4" fill="#6e6a5e"/>
  <text x="412" y="548" class="value" text-anchor="middle">$0</text>
  <!-- Qonversion $64 = 38px, y=522 -->
  <rect x="454" y="522" width="52" height="38" fill="#20241f"/>
  <text x="480" y="514" class="value" text-anchor="middle">$64</text>

  <text x="860" y="600" class="label" text-anchor="middle">$50,000 / month</text>
  <!-- RC $500 = 300px, y=260 -->
  <rect x="720" y="260" width="52" height="300" fill="#2c5f4f"/>
  <text x="746" y="252" class="value" text-anchor="middle">$500</text>
  <!-- Adapty $500 -->
  <rect x="788" y="260" width="52" height="300" fill="#9a6b23"/>
  <text x="814" y="252" class="value" text-anchor="middle">$500</text>
  <!-- Superwall $500, attributed -->
  <rect x="856" y="260" width="52" height="300" fill="#6e6a5e"/>
  <text x="882" y="252" class="value" text-anchor="middle">$500</text>
  <!-- Qonversion $400 = 240px, y=320 -->
  <rect x="924" y="320" width="52" height="240" fill="#20241f"/>
  <text x="950" y="312" class="value" text-anchor="middle">$400</text>

  <text x="56" y="652" class="foot">Superwall at $50,000 is $500 only when all of that revenue is paywall-attributed. If none of it is, that bar is $0.</text>
  <text x="56" y="676" class="foot">Startup is $49 per month plus 1% of attributed revenue. Scale is $199 per month plus 1%. Those plans are not in the bars.</text>
</svg>

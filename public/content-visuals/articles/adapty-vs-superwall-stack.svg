<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Where the paywall SDK sits relative to StoreKit</title>
  <desc id="desc">Checked Oct 20, 2026. Adapty alone and Superwall alone both reach StoreKit. The documented pair is Superwall with RevenueCat. Superwall plus Adapty is a migration overlap, not a long-term stack.</desc>
  <style>
    .eyebrow { font: 700 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 1.6px; fill: #2c5f4f; }
    .title { font: 600 32px "Source Serif 4", Georgia, serif; fill: #20241f; }
    .dek { font: 400 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
    .cardlabel { font: 700 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 1.1px; fill: #2c5f4f; }
    .box { font: 500 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20241f; }
    .boxmuted { font: 500 13px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
    .foot { font: 500 13px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
  </style>
  <rect width="1200" height="980" fill="#fbfaf7"/>
  <text x="48" y="48" class="eyebrow">STACK | CHECKED OCT 20, 2026</text>
  <text x="48" y="96" class="title">Paywall SDK, StoreKit, backend</text>
  <text x="48" y="128" class="dek">Three arrangements from the vendor docs. Keep one system as the entitlement authority.</text>

  <text x="72" y="180" class="cardlabel">ADAPTY ALONE</text>
  <rect x="48" y="196" width="352" height="88" rx="7" fill="#ffffff" stroke="#e7e2d7"/>
  <text x="224" y="246" class="box" text-anchor="middle">Your app</text>

  <line x1="224" y1="284" x2="224" y2="312" stroke="#2c5f4f" stroke-width="2"/>
  <polygon points="218,312 230,312 224,322" fill="#2c5f4f"/>

  <rect x="48" y="328" width="352" height="100" rx="7" fill="#ffffff" stroke="#e7e2d7"/>
  <text x="224" y="368" class="box" text-anchor="middle">Adapty SDK</text>
  <text x="224" y="394" class="boxmuted" text-anchor="middle">Paywall and subscription backend</text>

  <line x1="224" y1="428" x2="224" y2="456" stroke="#2c5f4f" stroke-width="2"/>
  <polygon points="218,456 230,456 224,466" fill="#2c5f4f"/>

  <rect x="48" y="472" width="352" height="88" rx="7" fill="#ffffff" stroke="#e7e2d7"/>
  <text x="224" y="522" class="box" text-anchor="middle">StoreKit</text>

  <line x1="224" y1="560" x2="224" y2="588" stroke="#2c5f4f" stroke-width="2"/>
  <polygon points="218,588 230,588 224,598" fill="#2c5f4f"/>

  <rect x="48" y="604" width="352" height="100" rx="7" fill="#ffffff" stroke="#2c5f4f"/>
  <text x="224" y="644" class="box" text-anchor="middle">Access decision</text>
  <text x="224" y="670" class="boxmuted" text-anchor="middle">Adapty holds entitlements</text>

  <text x="448" y="180" class="cardlabel">SUPERWALL ALONE</text>
  <rect x="424" y="196" width="352" height="88" rx="7" fill="#ffffff" stroke="#e7e2d7"/>
  <text x="600" y="246" class="box" text-anchor="middle">Your app</text>

  <line x1="600" y1="284" x2="600" y2="312" stroke="#2c5f4f" stroke-width="2"/>
  <polygon points="594,312 606,312 600,322" fill="#2c5f4f"/>

  <rect x="424" y="328" width="352" height="100" rx="7" fill="#ffffff" stroke="#e7e2d7"/>
  <text x="600" y="368" class="box" text-anchor="middle">Superwall SDK</text>
  <text x="600" y="394" class="boxmuted" text-anchor="middle">Paywall editor and campaigns</text>

  <line x1="600" y1="428" x2="600" y2="456" stroke="#2c5f4f" stroke-width="2"/>
  <polygon points="594,456 606,456 600,466" fill="#2c5f4f"/>

  <rect x="424" y="472" width="352" height="88" rx="7" fill="#ffffff" stroke="#e7e2d7"/>
  <text x="600" y="522" class="box" text-anchor="middle">StoreKit</text>

  <line x1="600" y1="560" x2="600" y2="588" stroke="#2c5f4f" stroke-width="2"/>
  <polygon points="594,588 606,588 600,598" fill="#2c5f4f"/>

  <rect x="424" y="604" width="352" height="100" rx="7" fill="#ffffff" stroke="#2c5f4f"/>
  <text x="600" y="644" class="box" text-anchor="middle">Access decision</text>
  <text x="600" y="670" class="boxmuted" text-anchor="middle">Infrastructure priced at $0</text>

  <text x="824" y="180" class="cardlabel">DOCUMENTED PAIR</text>
  <rect x="800" y="196" width="352" height="88" rx="7" fill="#ffffff" stroke="#e7e2d7"/>
  <text x="976" y="246" class="box" text-anchor="middle">Your app</text>

  <line x1="976" y1="284" x2="976" y2="312" stroke="#2c5f4f" stroke-width="2"/>
  <polygon points="970,312 982,312 976,322" fill="#2c5f4f"/>

  <rect x="800" y="328" width="352" height="100" rx="7" fill="#ffffff" stroke="#e7e2d7"/>
  <text x="976" y="368" class="box" text-anchor="middle">Superwall SDK</text>
  <text x="976" y="394" class="boxmuted" text-anchor="middle">Renders the paywall</text>

  <line x1="976" y1="428" x2="976" y2="456" stroke="#2c5f4f" stroke-width="2"/>
  <polygon points="970,456 982,456 976,466" fill="#2c5f4f"/>

  <rect x="800" y="472" width="352" height="88" rx="7" fill="#ffffff" stroke="#e7e2d7"/>
  <text x="976" y="508" class="box" text-anchor="middle">RevenueCat, then StoreKit</text>
  <text x="976" y="532" class="boxmuted" text-anchor="middle">Observes, or completes purchase</text>

  <line x1="976" y1="560" x2="976" y2="588" stroke="#2c5f4f" stroke-width="2"/>
  <polygon points="970,588 982,588 976,598" fill="#2c5f4f"/>

  <rect x="800" y="604" width="352" height="100" rx="7" fill="#ffffff" stroke="#2c5f4f"/>
  <text x="976" y="644" class="box" text-anchor="middle">Access decision</text>
  <text x="976" y="670" class="boxmuted" text-anchor="middle">One entitlement authority</text>

  <text x="48" y="760" class="foot">Observer mode is the recommended paired setup in Superwall's RevenueCat guide: Superwall completes the purchase, RevenueCat observes.</text>
  <text x="48" y="786" class="foot">A purchase controller is the other documented path: RevenueCat completes the purchase.</text>
  <text x="48" y="828" class="foot">Superwall plus Adapty is not a fourth column. Adapty's migration guide allows both during a rollout. Treat that as overlap, not a long-term stack.</text>
  <text x="48" y="854" class="foot">Superwall's advanced purchasing page names StoreKit, RevenueCat, Qonversion, or your own billing system. It does not name Adapty.</text>
  <text x="48" y="896" class="foot">Sources: superwall.com/docs/ios/guides/using-revenuecat, superwall.com/docs/ios/guides/advanced-configuration, adapty.io/docs/migration-from-superwall.</text>
  <text x="48" y="922" class="foot">Retrieved Oct 20, 2026. Products still live in App Store Connect.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Which AppFollow plan fits a solo app</title>
  <desc id="desc">Plans checked Nov 3, 2026. A five-path decision diagram. Use App Store Connect when reviews are few and the app is iOS-only. Use the Free plan for one review inbox across stores, with 7 days of history and API access. Use the ASO plan for keyword tracking, with 30 days of history and no trial. Use Essential for AI replies, translation, and more helpdesk integrations, with 365 days of history and a 10-day trial. Treat Team and Enterprise as support-team plans that are over-scoped for a solo app. The pricing page prints no prices for paid plans.</desc>
  <defs>
    <filter id="card-shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#20241f" flood-opacity="0.08"/>
    </filter>
    <style>
      .eyebrow { font: 700 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2.2px; text-transform: uppercase; fill: #2c5f4f; }
      .title { font: 600 42px "Source Serif 4", Georgia, serif; fill: #20241f; }
      .dek { font: 400 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
      .job { font: 600 22px "Source Serif 4", Georgia, serif; fill: #20241f; }
      .plan { font: 600 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20241f; }
      .detail { font: 400 16px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #474b44; }
      .warn { font: 600 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9e4434; }
      .note { font: 500 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a5e; }
    </style>
  </defs>
  <rect width="1200" height="860" fill="#fbfaf7"/>
  <text x="64" y="64" class="eyebrow">Plan fit</text>
  <text x="64" y="118" class="title">Which AppFollow plan, if any</text>
  <text x="64" y="156" class="dek">Plans from the AppFollow help center, checked Nov 3, 2026.</text>

  <g filter="url(#card-shadow)">
    <rect x="64" y="196" width="1072" height="96" rx="7" fill="#ffffff" stroke="#e7e2d7" stroke-width="2"/>
    <text x="92" y="236" class="job">A few reviews a week, iOS only</text>
    <text x="92" y="268" class="plan">App Store Connect</text>
    <text x="360" y="268" class="detail">View and reply to reviews for your own apps at no extra cost.</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="64" y="312" width="1072" height="96" rx="7" fill="#ffffff" stroke="#2c5f4f" stroke-width="2"/>
    <text x="92" y="352" class="job">One review inbox across stores</text>
    <text x="92" y="384" class="plan">Free plan, $0</text>
    <text x="360" y="384" class="detail">7 days of history. Replies, basic automation, and API access.</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="64" y="428" width="1072" height="96" rx="7" fill="#ffffff" stroke="#e7e2d7" stroke-width="2"/>
    <text x="92" y="468" class="job">Keyword tracking is the job</text>
    <text x="92" y="500" class="plan">ASO plan, price not printed</text>
    <text x="400" y="500" class="detail">30 days of history. No free trial. Compare the ASO category first.</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="64" y="544" width="1072" height="96" rx="7" fill="#ffffff" stroke="#e7e2d7" stroke-width="2"/>
    <text x="92" y="584" class="job">AI replies, translation, more helpdesk integrations</text>
    <text x="92" y="616" class="plan">Essential, price not printed</text>
    <text x="400" y="616" class="detail">365 days of history. 10-day free trial. Ask for a written quote.</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="64" y="660" width="1072" height="108" rx="7" fill="#fff7f5" stroke="#9e4434" stroke-width="2"/>
    <text x="92" y="700" class="job">A support team with agents</text>
    <text x="92" y="734" class="warn">Team or Enterprise</text>
    <text x="92" y="760" class="detail">Agent tracking, executive reports, custom roles, and SSO. Over-scoped for a solo app.</text>
  </g>

  <text x="64" y="818" class="note">Sources: appfollow.io/pricing and support.appfollow.io, Nov 3, 2026. The pricing page prints no prices for paid plans.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">RevenueCat monthly fee against monthly tracked revenue</title>
<desc id="desc">Step chart of the RevenueCat monthly fee from $0 to $50,000 in monthly tracked revenue. The fee is $0 under $2,500. At $2,500 the pricing page charges $25, which is 1% of all MTR. The line then follows 1% of all MTR: $100 at $10,000 and $500 at $50,000. A side panel shows the step at $2,500, from $0 to $25. Checked Oct 29, 2026. Source: revenuecat.com/pricing.</desc>
<defs>
<style>
.eyebrow { font: 700 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 1.4px; fill: #2c5f4f; }
.title { font: 600 28px "Source Serif 4", Georgia, serif; fill: #20241f; }
.dek { font: 400 15px Inter, ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #6e6a5e; }
.tick { font: 500 13px Inter, ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #6e6a5e; }
.point { font: 600 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #20241f; }
.panel-title { font: 600 15px "Source Serif 4", Georgia, serif; fill: #20241f; }
.panel-note { font: 500 13px Inter, ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #6e6a5e; }
.foot { font: 500 13px Inter, ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #6e6a5e; }
</style>
</defs>
<rect width="1200" height="675" fill="#fbfaf7"/>
<text x="48" y="40" class="eyebrow">PRICE LEDGER · CHECKED OCT 29, 2026</text>
<text x="48" y="78" class="title">Monthly fee against monthly tracked revenue</text>
<text x="48" y="108" class="dek">Free under $2,500 MTR. At $2,500 and above, the fee is 1% of all MTR, not 1% of only the overflow.</text>
<text x="48" y="132" class="dek">$25 and $26 are printed by RevenueCat. $100 and $500 apply that same 1% to the whole month.</text>
<rect x="92" y="168" width="656" height="310" rx="7" fill="#ffffff" stroke="#e7e2d7"/>
<line x1="100" y1="470.0" x2="740" y2="470.0" stroke="#e7e2d7"/><text x="90" y="474.0" class="tick" text-anchor="end">$0</text><line x1="100" y1="411.2" x2="740" y2="411.2" stroke="#e7e2d7"/><text x="90" y="415.2" class="tick" text-anchor="end">$100</text><line x1="100" y1="352.4" x2="740" y2="352.4" stroke="#e7e2d7"/><text x="90" y="356.4" class="tick" text-anchor="end">$200</text><line x1="100" y1="293.6" x2="740" y2="293.6" stroke="#e7e2d7"/><text x="90" y="297.6" class="tick" text-anchor="end">$300</text><line x1="100" y1="234.8" x2="740" y2="234.8" stroke="#e7e2d7"/><text x="90" y="238.8" class="tick" text-anchor="end">$400</text><line x1="100" y1="176.0" x2="740" y2="176.0" stroke="#e7e2d7"/><text x="90" y="180.0" class="tick" text-anchor="end">$500</text>
<line x1="132.0" y1="176" x2="132.0" y2="470" stroke="#9a6b23" stroke-dasharray="4 4"/>
<polyline fill="none" stroke="#2c5f4f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="100.0,470.0 132.0,470.0 132.0,455.3 228.0,411.2 740.0,176.0"/>
<circle cx="228.0" cy="411.2" r="5" fill="#2c5f4f"/>
<text x="228.0" y="399.2" class="point" text-anchor="middle">$100</text>
<circle cx="740.0" cy="176.0" r="5" fill="#2c5f4f"/>
<text x="730.0" y="196.0" class="point" text-anchor="end">$500</text>
<text x="100.0" y="492" class="tick" text-anchor="start">$0</text><text x="228.0" y="492" class="tick" text-anchor="middle">$10k</text><text x="420.0" y="492" class="tick" text-anchor="middle">$25k</text><text x="740.0" y="492" class="tick" text-anchor="end">$50k</text>
<text x="100" y="514" class="tick">Monthly tracked revenue. The gold dashed line is $2,500.</text>
<rect x="792" y="176" width="360" height="294" rx="7" fill="#ffffff" stroke="#e7e2d7"/>
<text x="812" y="204" class="panel-title">The step at $2,500</text>
<text x="812" y="226" class="panel-note">Zoomed to $0–$3,000 MTR</text>
<polyline fill="none" stroke="#2c5f4f" stroke-width="3" stroke-linejoin="round" points="820.0,434.0 1083.3,434.0 1083.3,321.5 1136.0,299.0"/>
<line x1="1083.3" y1="254" x2="1083.3" y2="434" stroke="#9a6b23" stroke-dasharray="3 3"/>
<circle cx="1083.3" cy="321.5" r="4.5" fill="#9a6b23"/>
<text x="1075.3" y="311.5" class="point" text-anchor="end">$25</text>
<text x="812" y="454" class="panel-note">FAQ: $25 at $2,500. Docs: $26 at $2,600.</text>
<text x="48" y="560" class="foot">Method: under $2,500 the fee is $0. From $2,500 up, fee = MTR × 0.01. $10,000 × 0.01 = $100. $50,000 × 0.01 = $500.</text>
<text x="48" y="584" class="foot">The pricing FAQ prints $25 at $2,500. The billing docs print $26 at $2,600. Both are 1% of all MTR.</text>
<text x="48" y="628" class="foot">RevenueCat pricing, checked Oct 29, 2026 · revenuecat.com/pricing</text>
<text x="48" y="652" class="foot">Also the billing docs: revenuecat.com/docs/welcome/set-up-revenuecat/account-management.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Worked examples of the RevenueCat monthly fee</title>
<desc id="desc">Five monthly fees. $2,000 MTR is $0. $2,500 MTR is $25, from the pricing FAQ. $2,600 MTR is $26, from the billing docs. $10,000 MTR is $100 and $50,000 MTR is $500, each computed as 1% of all MTR. Checked Oct 29, 2026.</desc>
<defs>
<style>
.eyebrow { font: 700 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 1.4px; fill: #2c5f4f; }
.title { font: 600 30px "Source Serif 4", Georgia, serif; fill: #20241f; }
.dek { font: 400 16px Inter, ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #6e6a5e; }
.label { font: 600 16px Inter, ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #6e6a5e; }
.fee { font: 600 42px "Source Serif 4", Georgia, serif; fill: #20241f; }
.note { font: 500 15px Inter, ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #20241f; }
.foot { font: 500 14px Inter, ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #6e6a5e; }
</style>
</defs>
<rect width="1200" height="675" fill="#fbfaf7"/>
<text x="48" y="48" class="eyebrow">WORKED EXAMPLES · CHECKED OCT 29, 2026</text>
<text x="48" y="96" class="title">1% of all MTR, once the month reaches $2,500</text>
<text x="48" y="132" class="dek">Under $2,500 the fee is $0. At $2,500 and above, multiply the whole month by 0.01.</text>

<rect x="48.0" y="168" width="204.8" height="280" rx="7" fill="#ffffff" stroke="#e7e2d7"/>
<text x="68.0" y="214" class="label">$2,000 MTR</text>
<text x="68.0" y="278" class="fee">$0</text>
<text x="68.0" y="328" class="note">Under $2,500.</text>
<text x="68.0" y="356" class="note">Not charged.</text>

<rect x="272.8" y="168" width="204.8" height="280" rx="7" fill="#ffffff" stroke="#e7e2d7"/>
<text x="292.8" y="214" class="label">$2,500 MTR</text>
<text x="292.8" y="278" class="fee">$25</text>
<text x="292.8" y="328" class="note">Pricing FAQ.</text>
<text x="292.8" y="356" class="note">1% of all $2,500.</text>

<rect x="497.6" y="168" width="204.8" height="280" rx="7" fill="#ffffff" stroke="#e7e2d7"/>
<text x="517.6" y="214" class="label">$2,600 MTR</text>
<text x="517.6" y="278" class="fee">$26</text>
<text x="517.6" y="328" class="note">Billing docs.</text>
<text x="517.6" y="356" class="note">1% of all $2,600.</text>

<rect x="722.4" y="168" width="204.8" height="280" rx="7" fill="#ffffff" stroke="#e7e2d7"/>
<text x="742.4" y="214" class="label">$10,000 MTR</text>
<text x="742.4" y="278" class="fee">$100</text>
<text x="742.4" y="328" class="note">Computed.</text>
<text x="742.4" y="356" class="note">1% of all $10,000.</text>

<rect x="947.2" y="168" width="204.8" height="280" rx="7" fill="#ffffff" stroke="#e7e2d7"/>
<text x="967.2" y="214" class="label">$50,000 MTR</text>
<text x="967.2" y="278" class="fee">$500</text>
<text x="967.2" y="328" class="note">Computed.</text>
<text x="967.2" y="356" class="note">1% of all $50,000.</text>

<text x="48" y="500" class="foot">$25 is the pricing FAQ figure for a $2,500 month. $26 is the billing docs figure for a $2,600 month.</text>
<text x="48" y="528" class="foot">$100 and $500 are not a second published price. They are $10,000 × 0.01 and $50,000 × 0.01.</text>
<text x="48" y="580" class="foot">A later month under $2,500 returns to $0. That rule is on the billing docs.</text>
<text x="48" y="632" class="foot">RevenueCat pricing, checked Oct 29, 2026 · revenuecat.com/pricing</text>
</svg>

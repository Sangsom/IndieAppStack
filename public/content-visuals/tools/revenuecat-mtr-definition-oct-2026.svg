<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">What RevenueCat counts as monthly tracked revenue</title>
<desc id="desc">Monthly tracked revenue includes paid subscriptions, renewals, and one-time purchases. It is measured in USD before store commission and taxes, as the amount charged to the customer. It is not monthly recurring revenue and it is not proceeds after the store cut. Checked Oct 29, 2026.</desc>
<defs>
<style>

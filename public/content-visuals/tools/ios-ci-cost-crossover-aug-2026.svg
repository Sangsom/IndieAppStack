<text x="96" y="46" font-family='ui-serif,"Source Serif 4",Georgia,"Times New Roman",serif' font-size="30" font-weight="600" fill="#20241f">Where Codemagic stops being the cheaper option</text>
<text x="96" y="72" font-size="15.5" fill="#6e6a5e">On the free plan: 500 macOS M2 minutes at $0, then $0.095 each. List prices, checked Aug 5, 2026.</text>

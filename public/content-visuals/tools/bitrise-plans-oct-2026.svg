<text x="249.0" y="564" font-size="14" fill="#20241f" text-anchor="middle">5 concurrent</text>
<rect x="411.0" y="381.0" width="32" height="89.0" rx="4" fill="#2c5f4f"/>
<text x="427.0" y="350.0" font-size="13" font-weight="600" fill="#20241f" text-anchor="middle">$89</text>

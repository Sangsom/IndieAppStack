<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="t d" font-family='ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif'>
<title id="t">Bitrise plan prices, annual billing versus monthly billing</title>
<desc id="d">Bar chart of Bitrise monthly price when billed annually and when billed monthly, checked October 25, 2026. Hobby is 0 dollars, with 1 private app, a team of one, and 5 concurrent builds. Starter tier 1 is 89 dollars yearly or 99 monthly, with 2 private apps and 1 concurrency. Starter tier 2 is 179 or 199, with 2 private apps and 2 concurrencies. Starter tier 3 is 269 or 299, with 3 private apps and 4 concurrencies. Pro starts at 200 yearly or 218 monthly, with unlimited private apps, 10 macOS concurrencies, and 30 Linux concurrencies. Enterprise is custom and is not a bar. Source: bitrise.io/pricing.</desc>
<rect width="1200" height="860" fill="#fbfaf7"/>

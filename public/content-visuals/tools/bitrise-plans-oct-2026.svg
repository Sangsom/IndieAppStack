<text x="1041.0" y="498" font-size="16" font-weight="600" fill="#20241f" text-anchor="middle">Pro, from</text>
<text x="1041.0" y="520" font-size="13" fill="#6e6a5e" text-anchor="middle">Starting price</text>
<text x="1041.0" y="542" font-size="14" fill="#20241f" text-anchor="middle">Unlimited apps</text>
<text x="1041.0" y="564" font-size="14" fill="#20241f" text-anchor="middle">10 macOS, 30 Linux</text>
<text x="64" y="620" font-size="15" fill="#6e6a5e">Hobby is free: 300 build credits a month. The pricing page does not say how many credits one minute uses.</text>
<text x="64" y="646" font-size="15" fill="#6e6a5e">Starter tiers are the View all Plan tiers table. The card ceiling of 4 concurrent builds and 3 private apps is tier 3.</text>
<text x="64" y="672" font-size="15" fill="#6e6a5e">Pro is the published starting price. The comparison table lists 10 macOS and 30 Linux concurrent builds.</text>
<text x="64" y="698" font-size="15" fill="#6e6a5e">Enterprise is custom, from 2,000 builds a month, and is not a bar.</text>
<text x="64" y="760" font-size="13" fill="#6e6a5e">Source: bitrise.io/pricing, plan cards, comparison table, Hobby FAQ, and Starter tier table. Checked Oct 25, 2026.</text>
<text x="64" y="820" font-size="13" fill="#6e6a5e">Prices are the monthly amount. Annual figures are the per-month rate when billed annually, not a yearly total.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Keywords Everywhere: earns its place versus skip it</title>
  <desc id="desc">A two-column decision graphic for solo mobile developers. Left column, when Keywords Everywhere earns a place: you are writing a launch page or blog post, you want volume, CPC, and competition while you browse Google, and you will check demand before buying ads or a content calendar. Right column, when to skip it: you need App Store keyword research, you only wanted a one-off Google volume number, you need rank tracking, or you expected it on iPhone or Safari.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#20241f" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #fbfaf7; }
      .headline { font: 700 36px "Source Serif 4", "Iowan Old Style", Georgia, serif; fill: #20241f; }
      .subhead { font: 400 20px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #6e6a5e; }
      .col { font: 700 22px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #fbfaf7; }
      .row { font: 500 19px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #20241f; }
      .foot { font: 500 18px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #6e6a5e; }
      .eyebrow { font: 700 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #9a6b23; letter-spacing: 2px; }
      .node { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #fbfaf7; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="675"/>

  <text class="eyebrow" x="60" y="58">INDIEAPPSTACK · FIELD GUIDE</text>
  <text class="headline" x="60" y="100">Does Keywords Everywhere earn a place?</text>
  <text class="subhead" x="60" y="134">A quick read for solo app builders deciding between Google keyword data and App Store ASO.</text>

  <line x1="600" y1="212" x2="600" y2="564" stroke="#6e6a5e" stroke-width="1.5" stroke-dasharray="2 7" opacity="0.4"/>

  <rect x="60" y="176" width="516" height="424" rx="14" fill="#ffffff" stroke="#e7e2d7" stroke-width="1.5" filter="url(#softShadow)"/>
  <path d="M 74 176 h 488 a14 14 0 0 1 14 14 v 50 h -516 v -50 a14 14 0 0 1 14 -14 z" fill="#2c5f4f"/>
  <text class="col" x="88" y="217">It earns its place</text>

  <g>
    <circle cx="100" cy="300" r="15" fill="#2c5f4f"/>
    <path d="M 94,300 L 98,305 L 107,294" stroke="#ffffff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="row" x="130" y="307">You are writing a launch page or post</text>

    <circle cx="100" cy="388" r="15" fill="#2c5f4f"/>
    <path d="M 94,388 L 98,393 L 107,382" stroke="#ffffff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="row" x="130" y="395">You want volume, CPC, and competition</text>

    <circle cx="100" cy="476" r="15" fill="#2c5f4f"/>
    <path d="M 94,476 L 98,481 L 107,470" stroke="#ffffff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="row" x="130" y="483">You will check demand before buying ads</text>
  </g>

  <rect x="624" y="176" width="516" height="424" rx="14" fill="#ffffff" stroke="#e7e2d7" stroke-width="1.5" filter="url(#softShadow)"/>
  <path d="M 638 176 h 488 a14 14 0 0 1 14 14 v 50 h -516 v -50 a14 14 0 0 1 14 -14 z" fill="#20241f"/>
  <text class="col" x="652" y="217">Skip it  for now</text>

  <g>
    <circle cx="664" cy="300" r="15" fill="none" stroke="#6e6a5e" stroke-width="2"/>
    <line x1="657" y1="300" x2="671" y2="300" stroke="#6e6a5e" stroke-width="2.6" stroke-linecap="round"/>
    <text class="row" x="694" y="307">You need App Store keyword research</text>

    <circle cx="664" cy="380" r="15" fill="none" stroke="#6e6a5e" stroke-width="2"/>
    <line x1="657" y1="380" x2="671" y2="380" stroke="#6e6a5e" stroke-width="2.6" stroke-linecap="round"/>
    <text class="row" x="694" y="387">A one-off Google volume check is enough</text>

    <circle cx="664" cy="460" r="15" fill="none" stroke="#6e6a5e" stroke-width="2"/>
    <line x1="657" y1="460" x2="671" y2="460" stroke="#6e6a5e" stroke-width="2.6" stroke-linecap="round"/>
    <text class="row" x="694" y="467">You need rank tracking, not an overlay</text>

    <circle cx="664" cy="540" r="15" fill="none" stroke="#6e6a5e" stroke-width="2"/>
    <line x1="657" y1="540" x2="671" y2="540" stroke="#6e6a5e" stroke-width="2.6" stroke-linecap="round"/>
    <text class="row" x="694" y="547">You expected it on iPhone or Safari</text>
  </g>

  <circle cx="600" cy="388" r="22" fill="#2c5f4f" stroke="#fbfaf7" stroke-width="3"/>
  <text class="node" x="600" y="394" text-anchor="middle">or</text>

  <text class="foot" x="60" y="644">Install the free extension first. Pay for credits only if the volume data would change a landing-page or content decision.</text>
</svg>
